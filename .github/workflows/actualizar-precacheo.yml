name: Precacheo completo (8 bots)
on:
  workflow_dispatch:
    inputs:
      force_full:
        description: Reanalizar tambien partidos completos
        type: boolean
        default: false
      workers:
        description: Procesos por bot (1-6)
        type: string
        default: '3'
      max_jobs:
        description: Solo diagnostico; 0 descarga todos
        type: string
        default: '0'
      handicap:
        description: Handicap o all
        type: string
        default: all
      ou:
        description: Over/Under o all
        type: string
        default: all
  schedule:
    - cron: '0 */3 * * *'
permissions:
  contents: write
concurrency:
  group: cloud-cache-upcoming-main
  cancel-in-progress: false
jobs:
  cache:
    uses: ./.github/workflows/cloud-cache-worker.yml
    with:
      kind: upcoming
      force_full: ${{ inputs.force_full || false }}
      workers: ${{ inputs.workers || '3' }}
      max_jobs: ${{ inputs.max_jobs || '0' }}
      handicap: ${{ inputs.handicap || 'all' }}
      ou: ${{ inputs.ou || 'all' }}
