name: Cargar histórico terminado en el Explorador

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turso-explorer-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Cargar los terminados sin usar RAM de Render
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          LIBSQL_REMOTE_ONLY: '1'
          SQL_BOOTSTRAP_MODE: schema_only
        run: python scripts/backfill_finished_to_turso.py --data data --batch-size 25
