name: Cachear partidos terminados en GitHub

on:
  workflow_dispatch:
    inputs:
      handicap:
        description: Filtro de handicap asiático
        required: false
        default: all
        type: string
      ou:
        description: Filtro de goles
        required: false
        default: all
        type: string
      workers:
        description: Workers por bot (1-6)
        required: false
        default: '3'
        type: string
      flush_every:
        description: Compatibilidad con el disparador antiguo (sin efecto)
        required: false
        default: '100'
        type: string
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: cachear-terminados-main
  cancel-in-progress: false

jobs:
  cachear:
    uses: ./.github/workflows/cloud-cache-worker.yml
    with:
      kind: finished
      workers: ${{ inputs.workers || '3' }}
      handicap: ${{ inputs.handicap || 'all' }}
      ou: ${{ inputs.ou || 'all' }}
    secrets: inherit
