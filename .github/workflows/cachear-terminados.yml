name: Cachear partidos terminados en GitHub

run-name: Cacheo de terminados (${{ inputs.handicap || 'all' }} / ${{ inputs.ou || 'all' }})

on:
  workflow_dispatch:
    inputs:
      handicap:
        description: "Filtro de Handicap Asiático (ej. 0.5, -0.5, all)"
        required: false
        default: "all"
        type: string
      ou:
        description: "Filtro de Over/Under (ej. 2.5, all)"
        required: false
        default: "all"
        type: string
      workers:
        description: "Número de hilos/workers paralelos"
        required: false
        default: "10"
        type: string
      flush_every:
        description: "Frecuencia de volcado incremental (cada N partidos)"
        required: false
        default: "5"
        type: string

permissions:
  contents: write

concurrency:
  group: cachear-terminados-main
  cancel-in-progress: false

jobs:
  cachear:
    name: Ejecutar cacheo de terminados
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APP_SQLITE_PATH: ${{ github.workspace }}/data/app_data.db
      APP_SQLITE_BOOTSTRAP_LOCK: ${{ github.workspace }}/data/app_data_bootstrap.lock
      DATA_LEGACY_SYNC: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Ejecutar cacheo de partidos terminados
        run: |
          python scripts/cache_finished_matches.py "${{ inputs.handicap }}" "${{ inputs.ou }}" "${{ inputs.workers }}" "${{ inputs.flush_every }}"

      - name: Publicar cambios en main
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            data.json \
            data/data.json \
            data/data_precacheo.json \
            data/data_pending_results.json \
            data/data_ah_*.json \
            data/data_minus_ah_*.json \
            data/league_extractions.json \
            data/app_data.db || true

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que publicar."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stamp="$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M %Z')"
          git commit -m "chore: cloud cache finished matches ${stamp}"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Resumen de ejecución
        if: always()
        run: |
          {
            echo "## Cacheo de partidos terminados finalizado"
            echo
            echo "- Handicap: **${{ inputs.handicap }}**"
            echo "- Over/Under: **${{ inputs.ou }}**"
            echo "- Workers: **${{ inputs.workers }}**"
            echo "- Commit publicado: **${{ steps.publish.outputs.published || 'false' }}**"
          } >> "$GITHUB_STEP_SUMMARY"
