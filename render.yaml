services:
  - type: web
    name: nowgoal-app
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 300 --graceful-timeout 30 --keep-alive 5 wsgi:app
    healthCheckPath: /precacheo
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_LEGACY_SYNC
        value: "0"
      - key: SQL_BOOTSTRAP_MODE
        value: "partial"
      - key: SQL_BOOTSTRAP_ONLY_BUCKETS
        value: "data_precacheo.json,data_pending_results.json"
      - key: APP_SQLITE_PATH
        value: "/tmp/app_data.db"
      - key: APP_SQLITE_BOOTSTRAP_LOCK
        value: "/tmp/app_data_bootstrap.lock"
      - key: EMPTY_SNAPSHOT_REFRESH_COOLDOWN_SECONDS
        value: "300"
      - key: LIBSQL_SYNC_INTERVAL_SECONDS
        value: "60"
      - key: LIBSQL_URL
        sync: false
      - key: LIBSQL_AUTH_TOKEN
        sync: false
      - key: EXPLORER_CACHE_TTL_SECONDS
        value: "60"
      - key: PRECACHEO_LIST_DEFAULT_LIMIT
        value: "350"
      - key: PRECACHEO_LIST_MAX_LIMIT
        value: "1500"
      - key: RENDER_LITE_MODE
        value: "1"
      - key: APP_PRECACHEO_ONLY
        value: "1"
      - key: PRECACHEO_UI_ITEMS_PER_PAGE
        value: "120"
      - key: PRECACHEO_PICKS_CLIENT_MAX
        value: "60"
      - key: PRECACHEO_PICKS_BATCH_MAX
        value: "80"
      - key: PRECACHEO_ACTIONS_MODE
        value: "ai_stats_only"
      - key: PRECACHEO_PICKS_V2_RELOAD_SECONDS
        value: "1800"
      - key: PRECACHEO_AUTO_SCRAPE_ON_GAP
        value: "1"
      - key: PRECACHEO_AUTO_SCRAPE_BATCH_MAX
        value: "12"
      - key: PRECACHEO_AUTO_SCRAPE_CONCURRENCY
        value: "1"
      - key: PRECACHEO_ENABLE_QWEN
        value: "0"
      - key: PRECACHEO_ENABLE_HEAVY_ACTIONS
        value: "0"
      - key: GROQ_API_KEY
        sync: false
