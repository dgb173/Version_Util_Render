<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f7f9fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            background-color: #fff;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
            padding: 20px;
            z-index: 1000;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
            transition: margin-left 0.3s ease;
        }

        /* Collapsed Sidebar */
        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .main-content.expanded {
            margin-left: 0;
        }

        .nav-link {
            color: #333;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .nav-link:hover,
        .nav-link.active {
            background-color: #e9ecef;
            color: #0d6efd;
        }

        .nav-link i {
            width: 25px;
        }

        /* Excel-like Table Styles */
        .excel-table {
            background: #fff;
            border: 1px solid #dee2e6;
            font-size: 0.85rem;
            width: 100%;
        }

        .excel-table th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            padding: 8px;
            vertical-align: middle;
            font-weight: 600;
            color: #495057;
            text-align: center;
            overflow: visible;
            /* Allow dropdowns to overflow */
        }

        .excel-table td {
            padding: 6px 8px;
            vertical-align: middle;
            border: 1px solid #dee2e6;
        }

        .excel-table tbody tr:hover {
            background-color: #e8f0fe;
        }

        /* Filter Inputs in Header */
        .header-filter {
            width: 100%;
            padding: 4px;
            font-size: 0.8rem;
            border: 1px solid #ced4da;
            border-radius: 3px;
            margin-top: 5px;
        }

        /* Specific Column Styles */
        .col-ah {
            width: 80px;
            text-align: center;
            font-weight: 800;
            font-size: 1rem;
            background-color: #e8f5e9;
        }

        .col-res {
            width: 80px;
            text-align: center;
            font-weight: 800;
            font-size: 1rem;
        }

        .col-team {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .col-prev {
            font-size: 0.85rem;
        }

        .col-h2h-col3 {
            background-color: #ffe4ec !important;
        }

        /* Fondo rojo claro para celdas sin datos */
        .cell-no-data {
            background-color: #ffcdd2 !important;
        }

        /* Stats Styles */
        .text-home {
            color: #0d6efd !important;
        }

        .text-away {
            color: #dc3545 !important;
        }

        .bg-home {
            background-color: #0d6efd !important;
        }

        .bg-away {
            background-color: #dc3545 !important;
        }

        .stat-row {
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }

        .bg-win {
            background-color: #d1e7dd;
        }

        .bg-loss {
            background-color: #f8d7da;
        }

        .bg-draw {
            background-color: #fff3cd;
        }

        /* Estilo naranja para PUSH */
        .text-push {
            color: #ff9800 !important;
            font-weight: 600;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
                width: 280px;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);

            }

                left: 0;
                right: 0;

                background: #fff;

                left: 0;
                right: 0;
                bottom: 0;

            }

            }

            /* Table optimizations for mobile */
            .excel-table {

            }

            .excel-table th,

            }

            }

            .col-ah,

        }

        /* H2H Col3 - Fondo rosa para distinguirla */
        .col-h2h-col3 {

        }

        /* Fondo rojo claro para celdas sin datos */

        }

        /* MultiSelect Styles */
        .multiselect-container {
            position: relative;
            width: 100%;
        }

        .multiselect-btn {
            width: 100%;
            text-align: left;
            background: linear-gradient(to bottom, #fff, #f8f9fa);
            border: 1px solid #adb5bd;
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            font-weight: 500;
            color: #495057;
            transition: all 0.2s ease;
        }

        .multiselect-btn:hover {
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
            border-color: #6c757d;
        }

        .multiselect-btn::after {
            content: '▼';
            font-size: 0.6rem;
            margin-left: 5px;
            color: #6c757d;
        }

        .multiselect-dropdown {
            display: none;
            position: fixed;
            /* Fixed instead of absolute to escape overflow:hidden containers */
            width: 260px;
            max-height: 350px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #adb5bd;
            z-index: 9999;
            /* Very high z-index */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 4px 0;
        }

        .multiselect-dropdown.show {
            display: block;
        }

        .multiselect-option {
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;

        }

        .multiselect-option:last-child {

        }

        .multiselect-option:hover {

        }

        .multiselect-option input {
            margin-right: 8px;
            width: 16px;
            height: 16px;

        }

        /* Color coding for positive/negative handicaps */

        }

        }

        .multiselect-option strong {

        // Pagination State
        let currentPage = 1;
        const itemsPerPage = 250;
        let totalResults = [];
        // URL presets from "Buscar Patrones": strict favorite layer injected into backend filters.
        let explorerPresetStrictFilters = {};

        // --- MultiSelect Class ---
        class MultiSelect {
            constructor(containerId, options, placeholder = 'Select...', onChangeCallback = null) {
                this.container = document.getElementById(containerId);
                this.options = options; // [{value, label}]
                this.placeholder = placeholder;
                this.onChange = onChangeCallback;
                this.selectedValues = [];

                this.render();
            }

            render() {
                if (!this.container) return;
                this.container.innerHTML = '';
                this.container.classList.add('multiselect-container');

                // Button
                this.btn = document.createElement('div');
                this.btn.className = 'multiselect-btn';
                this.updateBtnText();
                this.btn.onclick = (e) => {
                    e.stopPropagation();
                    // Close others
                    document.querySelectorAll('.multiselect-dropdown.show').forEach(el => {
                        if (el !== this.dropdown) el.classList.remove('show');
                    });

                    // Calculate position for fixed dropdown
                    const rect = this.btn.getBoundingClientRect();
                    this.dropdown.style.top = (rect.bottom + 2) + 'px';
                    this.dropdown.style.left = rect.left + 'px';

                    // Ensure dropdown doesn't go off-screen to the right
                    const dropdownWidth = 260;
                    if (rect.left + dropdownWidth > window.innerWidth) {
                        this.dropdown.style.left = (window.innerWidth - dropdownWidth - 10) + 'px';
                    }

                    this.dropdown.classList.toggle('show');
                };
                this.container.appendChild(this.btn);

                // Dropdown
                this.dropdown = document.createElement('div');
                this.dropdown.className = 'multiselect-dropdown';

                // "All/Clear" option
                const allOpt = document.createElement('div');
                allOpt.className = 'multiselect-option';
                allOpt.innerHTML = '<strong>Limpiar / Todos</strong>';
                allOpt.onclick = () => {
                    this.selectedValues = [];
                    this.updateBtnText();
                    this.renderOptions(); // Re-render checkboxes
                    if (this.onChange) this.onChange();
                };
                this.dropdown.appendChild(allOpt);

                this.optionsListCtx = document.createElement('div');
                this.dropdown.appendChild(this.optionsListCtx);

                this.renderOptions();

                this.container.appendChild(this.dropdown);

                // Close on click outside
                document.addEventListener('click', (e) => {
                    if (!this.container.contains(e.target)) {
                        this.dropdown.classList.remove('show');
                    }
                });
            }

            renderOptions() {
                this.optionsListCtx.innerHTML = '';
                this.options.forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'multiselect-option';

                    // Apply color coding for positive/negative values
                    const numVal = parseFloat(opt.value);
                    if (!isNaN(numVal)) {
                        if (numVal > 0) {
                            div.setAttribute('data-positive', 'true');
                            div.style.color = '#0d6efd'; // Blue for positive (Home Underdog)
                        } else if (numVal < 0) {
                            div.setAttribute('data-negative', 'true');

                    div.appendChild(cb);

                    const numVal2 = parseFloat(opt.value);
                    if (!isNaN(numVal2) && numVal2 !== 0) {
                        const icon = numVal2 > 0 ? '↑' : '↓';
                        label.textContent = `${icon} ${opt.label}`;
                    } else {
                        label.textContent = opt.label;
                    }
                    div.appendChild(label);

                    // Allow clicking row to toggle
                    div.onclick = (e) => {
                        if (e.target !== cb) {
                            cb.checked = !cb.checked;
                            cb.dispatchEvent(new Event('change'));
                        }
                    };

                    this.optionsListCtx.appendChild(div);
                });
            }

            updateBtnText() {
                if (this.selectedValues.length === 0) {
                    this.btn.textContent = this.placeholder;
                } else if (this.selectedValues.length <= 2) {
                    this.btn.textContent = this.selectedValues.map(v => v.toString()).join(', ');

        // MultiSelect Instances
        let msHandicap, msOu, msPrevHomeAh, msPrevAwayAh, msH2hCol3Ah, msIndLocalAh, msIndVisitanteAh;

        // Helper for MultiSelect AH matching - Uses buckets:
        // 0 = exactly 0
        // 0.5 = 0.25, 0.5, 0.75
        // 1 = exactly 1
        // 1.5 = 1.25, 1.5, 1.75
        // 2.0 = exacto
        // 2.5+ = 2.25, 2.5, 2.75, 3, etc.
        const checkAhMatch = (rowAhStr, selectedValues) => {
            if (!selectedValues || selectedValues.length === 0) return true;
            const rowAh = parseFloat(rowAhStr);
            if (isNaN(rowAh)) return false;

            const absRowAh = Math.abs(rowAh);

            return selectedValues.some(valStr => {
                const fAh = parseFloat(valStr);
                const absFAh = Math.abs(fAh);

                // 2.5+ bucket (or -2.5 and lower)
                if (absFAh >= 2.49) {
                    if (fAh > 0) return rowAh >= 2.24;
                    else return rowAh <= -2.24;
                }

                // 2.0 bucket: strict 2.0 / -2.0
                if (Math.abs(absFAh - 2) < 0.01) {
                    if (fAh > 0) return Math.abs(rowAh - 2) < 0.01;
                    else return Math.abs(rowAh + 2) < 0.01;
                }

                // For 1.5 bucket: includes 1.25, 1.5, 1.75
                if (Math.abs(absFAh - 1.5) < 0.01) {
                    if (fAh > 0) return rowAh >= 1.24 && rowAh <= 1.76;     // Solo positivos
                    else return rowAh <= -1.24 && rowAh >= -1.76;           // Solo negativos
                }

                // For 1 bucket: exactly 1
                if (Math.abs(absFAh - 1) < 0.01) {
                    if (fAh > 0) return Math.abs(rowAh - 1) < 0.01;         // Solo +1
                    else return Math.abs(rowAh + 1) < 0.01;                 // Solo -1
                }

                // For 0.5 bucket: includes 0.25, 0.5, 0.75
                if (Math.abs(absFAh - 0.5) < 0.01) {
                    if (fAh > 0) return rowAh >= 0.24 && rowAh <= 0.76;     // Solo positivos
                    else return rowAh <= -0.24 && rowAh >= -0.76;           // Solo negativos
                }

                // For 0 bucket: exactly 0
                if (absFAh < 0.01) {
                    return absRowAh < 0.01;
                }

                // Fallback: exact match with tolerance
                return Math.abs(rowAh - fAh) < 0.01;
            });
        };

        const getOuFilterValues = () => {
            if (msOu) return msOu.getValues();

            const raw = document.getElementById('filter-ou')?.value || '';
            return raw

        const syncOuFilterInput = () => {

            if (!input) return;

        const checkOuMatch = (rowOuStr, selectedValues) => {
            if (!selectedValues || selectedValues.length === 0) return true;

            const rowOu = parseFloat(rowOuStr);
            if (isNaN(rowOu)) return false;

            return selectedValues.some(valStr => {
                const filterOu = parseFloat(String(valStr).replace('+', ''));
                if (isNaN(filterOu)) return false;

                if (filterOu >= 4.0) return rowOu >= 4.0;
                return Math.abs(rowOu - filterOu) <= 0.26;
            });

        // Parsear movimiento H2H para obtener AH inicial y final
        // Ejemplo: "-0.5 → 0" => { start: -0.5, end: 0 }
        function parseH2HMovement(movementStr) {
            if (!movementStr || movementStr === 'N/A' || typeof movementStr !== 'string') {
                return { start: null, end: null };
            }

            const normalizedMovement = movementStr.replace(/,/g, '.');

            // Regex robusta para capturar dos números (decimales o enteros, positivos o negativos)
            // separados por cualquier cosa que no sea número/punto/guión
            // Soporta "→", "->", " a ", " to ", etc.
            const match = normalizedMovement.match(/([+-]?\d*\.?\d+)\s*[^\d.\-]+\s*([+-]?\d*\.?\d+)/);

            if (match && match.length >= 3) {
                return {
                    start: parseFloat(match[1]),
                    end: parseFloat(match[2])
                };
            }

            // Fallback para separadores conocidos si el regex falla (ej: casos raros)
            const separators = ['\u2192', '->', ' a ', ' to '];
            let parts = null;
            for (const sep of separators) {
                if (normalizedMovement.includes(sep)) {
                    parts = normalizedMovement.split(sep).map(s => s.trim());
                    break;
                }
            }

            if (!parts || parts.length !== 2) {
                // Último intento: buscar si hay SOLO una flecha unicode específica
                if (normalizedMovement.indexOf('→') !== -1) {
                    parts = normalizedMovement.split('→').map(s => s.trim());
                } else {
                    return { start: null, end: null };
                }
            }

            if (!parts || parts.length !== 2) return { start: null, end: null };

            const parseAh = (s) => {
                const cleaned = s.replace(/[^\d.\-+]/g, '');
                const num = parseFloat(cleaned);
                return isNaN(num) ? null : num;
            };
            return {
                start: parseAh(parts[0]),
                end: parseAh(parts[1])
            };
        }

        // Normalizar AH a bucket para comparación (0.25, 0.5, 0.75 se tratan como 0.5)
        function normalizeToHandicapBucket(ah) {
            if (ah === null || ah === undefined || isNaN(ah)) return null;
            const absAh = Math.abs(ah);
            const decimal = absAh % 1;
            // Si está entre 0.24 y 0.76, es bucket 0.5
            if (decimal >= 0.24 && decimal <= 0.76) {
                return ah >= 0 ? Math.floor(absAh) + 0.5 : -(Math.floor(absAh) + 0.5);
            }
            // Si está cerca de un entero, redondear
            if (decimal < 0.24) {
                return ah >= 0 ? Math.floor(absAh) : -Math.floor(absAh);
            }
            return ah >= 0 ? Math.ceil(absAh) : -Math.ceil(absAh);
        }

        function toExplorerBucketValue(rawVal) {
            const num = parseFloat(rawVal);
            if (isNaN(num)) return '';
            const bucket = normalizeToHandicapBucket(num);
            if (bucket === null) return '';
            if (bucket >= 2.5) return '2.5';
            if (bucket <= -2.5) return '-2.5';
            return String(bucket);
        }

        function matchesBucketOrExtreme(movBucket, filterRaw) {
            if (movBucket === null || movBucket === undefined) return false;
            const filterBucket = normalizeToHandicapBucket(parseFloat(filterRaw));
            if (filterBucket === null) return false;
            if (filterBucket >= 2.5) return movBucket >= 2.5;
            if (filterBucket <= -2.5) return movBucket <= -2.5;
            return movBucket === filterBucket;
        }

        function getH2HGeneralMovementDirection(movementStr) {
            const mov = parseH2HMovement(movementStr);
            if (mov.start === null || mov.end === null) return null;

            // H2H General can come with inverted home/away.
            // Compare ABS buckets so movement means "more/less favorite" consistently.
            const startBucket = normalizeToHandicapBucket(mov.start);
            const endBucket = normalizeToHandicapBucket(mov.end);
            if (startBucket === null || endBucket === null) return null;

            const absStart = Math.abs(startBucket);
            const absEnd = Math.abs(endBucket);
            if (Math.abs(absStart - absEnd) < 0.01) return 'SAME';
            return absEnd > absStart ? 'UP' : 'DOWN';
        }

        function applyExplorerUrlPresetFilters() {
            const params = new URLSearchParams(window.location.search);

            let hasPreset = false;
            const isPatternAutoSearch = params.get('auto_search') === '1' && !!params.get('source_match_id');
            const applyH2hLinePresets = !isPatternAutoSearch || params.get('apply_h2h_line') === '1';

            const applySelectValue = (id, rawValue) => {
                if (!rawValue) return false;
                const el = document.getElementById(id);
                if (!el) return false;
                const value = toExplorerBucketValue(rawValue);
                if (!value) return false;
                const exists = Array.from(el.options).some(opt => opt.value === value);
                if (!exists) return false;
                el.value = value;
                return true;
            };

            const applySelectRawValue = (id, rawValue, allowedValues) => {

                const exists = Array.isArray(ms.options) && ms.options.some(opt => String(opt.value) === String(value));
                if (!exists) return false;

                if (ms.renderOptions) ms.renderOptions();

            const applyOuMultiSelectValue = (ms, rawValue) => {

            // Presets for H2H General
            const generalStartRaw = params.get('h2h_general_start');
            const generalEndRaw = params.get('h2h_general_end');
            const generalMovRaw = params.get('h2h_general_mov');
            const generalResRaw = params.get('h2h_general_res');

            if (applyH2hLinePresets) {
                hasPreset = applySelectValue('filter-h2h-general-start-ah', generalStartRaw) || hasPreset;
                hasPreset = applySelectValue('filter-h2h-general-end-ah', generalEndRaw) || hasPreset;
            }
            hasPreset = applySelectRawValue('filter-h2h-general-mov', generalMovRaw, ['UP', 'DOWN', 'SAME']) || hasPreset;
            hasPreset = applySelectRawValue('filter-h2h-general-res', generalResRaw, ['COVER', 'PUSH', 'NO_COVER']) || hasPreset;

            // Presets for H2H Stadium (fallback source)
            const stadiumStartRaw = params.get('h2h_stadium_start');
            const stadiumEndRaw = params.get('h2h_stadium_end');
            const stadiumMovRaw = params.get('h2h_stadium_mov');
            const stadiumResRaw = params.get('h2h_stadium_res');

            if (applyH2hLinePresets) {
                hasPreset = applySelectValue('filter-h2h-stadium-start-ah', stadiumStartRaw) || hasPreset;
                hasPreset = applySelectValue('filter-h2h-stadium-end-ah', stadiumEndRaw) || hasPreset;
            }
            hasPreset = applySelectRawValue('filter-h2h-stadium-mov', stadiumMovRaw, ['UP', 'DOWN', 'SAME']) || hasPreset;
            hasPreset = applySelectRawValue('filter-h2h-stadium-res', stadiumResRaw, ['COVER', 'PUSH', 'NO_COVER']) || hasPreset;

            // Strict layer from source match: same favorite side + exact AH + favorite result.
            explorerPresetStrictFilters = {};

            const favAhRaw = params.get('fav_ah_exact');
            if (favAhRaw !== null && favAhRaw !== '') {
                const favAh = parseFloat(String(favAhRaw).replace(',', '.'));
                if (!isNaN(favAh)) {
                    explorerPresetStrictFilters.exact_handicap = favAh;
                }
            }

            const favSideRaw = (params.get('fav_side') || '').toUpperCase();
            if (favSideRaw === 'HOME' || favSideRaw === 'AWAY') {
                explorerPresetStrictFilters.favorite_side = favSideRaw;
            }

            const favResultRaw = (params.get('fav_result') || '').toUpperCase();
            if (favResultRaw === 'COVER' || favResultRaw === 'PUSH' || favResultRaw === 'NO_COVER') {
                explorerPresetStrictFilters.favorite_result = favResultRaw;
            }

            // Optional preset for favorite previous match layer.
            const prevHomeAhRaw = params.get('prev_home_ah');
            const prevHomeResRaw = params.get('prev_home_res');
            const prevAwayAhRaw = params.get('prev_away_ah');
            const prevAwayResRaw = params.get('prev_away_res');

            hasPreset = applyMultiSelectValue(msPrevHomeAh, prevHomeAhRaw) || hasPreset;
            const prevHomeResNorm = (() => {
                const v = (prevHomeResRaw || '').toUpperCase();
                if (v === 'WIN' || v === 'W') return 'HOME_WIN';
                if (v === 'LOSS' || v === 'L') return 'AWAY_WIN';
                if (v === 'D') return 'DRAW';
                return v;
            })();
            hasPreset = applySelectRawValue('filter-prev-home-res', prevHomeResNorm, ['HOME_WIN', 'DRAW', 'AWAY_WIN']) || hasPreset;
            hasPreset = applyMultiSelectValue(msPrevAwayAh, prevAwayAhRaw) || hasPreset;
            const prevAwayResNorm = (() => {
                const v = (prevAwayResRaw || '').toUpperCase();
                if (v === 'WIN' || v === 'W') return 'HOME_WIN';
                if (v === 'LOSS' || v === 'L') return 'AWAY_WIN';
                if (v === 'D') return 'DRAW';
                return v;
            })();
            hasPreset = applySelectRawValue('filter-prev-away-res', prevAwayResNorm, ['HOME_WIN', 'DRAW', 'AWAY_WIN']) || hasPreset;

            const ouLimitRaw = params.get('ou_limit');
            hasPreset = applyOuMultiSelectValue(msOu, ouLimitRaw) || hasPreset;

            const shouldAutoSearch = params.get('auto_search') === '1';
            if ((hasPreset || Object.keys(explorerPresetStrictFilters).length > 0) && shouldAutoSearch) {
                triggerSearch();

        }

        // Helper function to calculate Asian Result Category
        function getAsianResultCategory(teamGoals, oppGoals, ahValue) {
            if (teamGoals === null || oppGoals === null || ahValue === null || isNaN(ahValue)) return 'UNKNOWN';

            const diff = teamGoals - oppGoals;
            const line = parseFloat(ahValue);
            const finalDiff = diff + line;

            if (finalDiff > 0) return 'HOME_WIN';
            if (finalDiff < 0) return 'AWAY_WIN';
            return 'DRAW'; // Push
        }

        // Helper: calcular resultado H2H COVER/PUSH/NO_COVER
        // COVER = el FAVORITO cubrió el handicap actual
        // isInverted = true para H2H General (el partido fue en estadio del visitante actual)
        function calculateH2HResult(resultStr, currentAh, isInverted = false) {
            if (!resultStr || !resultStr.includes(':')) return null;
            if (currentAh === null || currentAh === undefined || isNaN(currentAh)) return null;

            const parts = resultStr.replace('-', ':').split(':');
            let h = parseInt(parts[0]);
            let a = parseInt(parts[1]);

            if (isNaN(h) || isNaN(a)) return null;

            // Regla Crítica: AH POSITIVO (> 0) = LOCAL FAVORITO. AH CERO O NEGATIVO (<= 0) = VISITANTE FAVORITO.
            const favIsLocal = currentAh > 0;
            const absAh = Math.abs(currentAh);

            let diff; // Diferencia goles desde la perspectiva del favorito
            if (isInverted) {
                diff = favIsLocal ? (a - h) : (h - a);
            } else {
                diff = favIsLocal ? (h - a) : (a - h);
            }

            // Aplicar handicap al favorito (lo DA, por eso es -absAh)
            const finalDiff = diff - absAh;

            if (finalDiff > 0) return 'COVER'; // Verde
            if (finalDiff < 0) return 'NO_COVER'; // Rojo
            return 'PUSH'; // Naranja
        }

        function calculateWDL(scoreStr, ahForTeam, isHomePerspective = true) {
            if (!scoreStr || ahForTeam === null || ahForTeam === undefined) return null;
            try {
                const parts = scoreStr.replace('-', ':').split(':');
                if (parts.length !== 2) return null;
                const hg = parseInt(parts[0]);
                const ag = parseInt(parts[1]);
                if (isNaN(hg) || isNaN(ag)) return null;

                if (isHomePerspective) {
                    return getAsianResultCategory(hg, ag, ahForTeam);
                } else {
                    return getAsianResultCategory(ag, hg, ahForTeam);
                }
            } catch (e) {
                console.error("Error calc WDL", e);
                return null;
            }
        }

        const getIndCoverStatus = (score, localia, isSubjectHome, currentAh) => {
            if (!score || score === '?:?' || isNaN(currentAh)) return null;
            const isSubjectLocalInInd = (localia === 'L' || localia === 'H' || localia === 'Local' || localia === 'Home');
            const subjectPerspectiveAh = isSubjectHome ? -currentAh : currentAh;
            const wdl = calculateWDL(score, subjectPerspectiveAh, isSubjectLocalInInd);
            if (wdl === 'HOME_WIN') return 'COVER';
            if (wdl === 'AWAY_WIN') return 'NO_COVER';
            if (wdl === 'DRAW') return 'PUSH';
            return null;
        };

        // Helper global para validar valores
        const isValidValue = (val) => val !== undefined && val !== null && val !== 'undefined' && val !== '';



        function triggerSearch() {
            // Helper to get single value or null
            const getSingleOrNull = (ms) => {
                if (!ms) return null;
                const vals = ms.getValues();
                return vals.length === 1 ? vals[0] : null;
            };

            const params = new URLSearchParams(window.location.search);
            const mapPrevResToApi = (rawVal) => {
                const v = (rawVal || '').toUpperCase();
                if (!v) return null;
                if (v === 'HOME_WIN' || v === 'DRAW' || v === 'AWAY_WIN') return v;
                if (v === 'WIN' || v === 'W') return 'HOME_WIN';
                if (v === 'LOSS' || v === 'L') return 'AWAY_WIN';
                if (v === 'D') return 'DRAW';
                return null;
            };

            const filters = {
                handicap: getSingleOrNull(msHandicap),
                team: null, // Team search inputs removed
                prev_home_wdl: document.getElementById('filter-prev-home-res').value || null,
                prev_away_wdl: document.getElementById('filter-prev-away-res').value || null,
                prev_home_ah: getSingleOrNull(msPrevHomeAh),
                prev_away_ah: getSingleOrNull(msPrevAwayAh),
                // New H2H Filters
                h2h_stadium_mov: document.getElementById('filter-h2h-stadium-mov').value || null,
                h2h_stadium_res: document.getElementById('filter-h2h-stadium-res').value || null,
                h2h_general_mov: document.getElementById('filter-h2h-general-mov').value || null,
                h2h_general_res: document.getElementById('filter-h2h-general-res').value || null,

                // NEW: FT Result and O/U Filters
                cover_result: document.getElementById('filter-cover-result').value || null,
                ou_limit: getSingleOrNull(msOu),

                exclude_empty: document.getElementById('filter-exclude-empty').checked,
                only_with_history: document.getElementById('filter-only-with-history').checked,
                analyze_all: true,
                include_stats: true,
                limit: 20000
            };

            // URL fallback (if UI presets were not reflected, keep backend filtering aligned).
            if (!filters.prev_home_ah) {
                const p = params.get('prev_home_ah');
                if (p !== null && p !== '') filters.prev_home_ah = toExplorerBucketValue(p);
            }
            if (!filters.prev_home_wdl) {
                filters.prev_home_wdl = mapPrevResToApi(params.get('prev_home_res'));
            }
            if (!filters.prev_away_ah) {
                const p = params.get('prev_away_ah');
                if (p !== null && p !== '') filters.prev_away_ah = toExplorerBucketValue(p);
            }
            if (!filters.prev_away_wdl) {
                filters.prev_away_wdl = mapPrevResToApi(params.get('prev_away_res'));
            }

            const prevResMode = (params.get('prev_res_mode') || '').toLowerCase();
            if (prevResMode === 'real') {
                const phReal = mapPrevResToApi(params.get('prev_home_res'));
                const paReal = mapPrevResToApi(params.get('prev_away_res'));
                if (phReal) filters.prev_home_real_wdl = phReal;
                if (paReal) filters.prev_away_real_wdl = paReal;
                if (params.get('auto_search') === '1') {
                    if (filters.prev_home_real_wdl) filters.prev_home_wdl = null;
                    if (filters.prev_away_real_wdl) filters.prev_away_wdl = null;
                }
            }

            if (explorerPresetStrictFilters && Object.keys(explorerPresetStrictFilters).length > 0) {
                Object.assign(filters, explorerPresetStrictFilters);
            }

            const spinner = document.getElementById('loading-overlay');
            spinner.classList.remove('d-none');

            fetch('/api/explorer_search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    filters: filters
                })
            })
                .then(response => response.json())
                .then(data => {
                    spinner.classList.add('d-none');
                    totalResults = data.results || [];

                    currentPage = 1;
                    // Aplicar filtros client-side inmediatamente después de cargar
                    renderTableWithPagination();

                    // Reinicializar Bootstrap collapses para que funcionen correctamente
                    reinitBootstrapCollapses();
                })
                .catch(err => {
                    spinner.classList.add('d-none');
                    alert('Error al cargar datos: ' + err.message);
                });
        }

        function renderTableWithPagination() {
            // Aplicar filtro client-side "Solo con historial"
            const onlyWithHistory = document.getElementById('filter-only-with-history').checked;
            let filteredResults = totalResults;
            // DEBUG:
            // console.log(`Total Results: ${ totalResults.length } `);
            if (totalResults.length === 0) {
                // Si no hay resultados de la API, no hay nada que filtrar.
                renderTable([]);
                renderPaginationControls(0);
                return;
            }

            if (onlyWithHistory) {
                filteredResults = totalResults.filter(item => {
                    // Requiere datos en AMBOS Prev Home y Prev Away
                    const hasPrevHome = item.prev_home && item.prev_home.score;
                    const hasPrevAway = item.prev_away && item.prev_away.score;
                    return hasPrevHome && hasPrevAway;
                });
            }

            // Filtro: Excluir partidos juveniles (excepto Italia U20/U21 e Inglaterra U21/U23)
            filteredResults = filteredResults.filter(item => {
                const c = item.candidate;
                const homeTeam = (c.home_team || c.home || '').toLowerCase();
                const awayTeam = (c.away_team || c.away || '').toLowerCase();
                const league = (c.league || '').toLowerCase();

                // Ligas juveniles permitidas
                const allowedJuvenile = league.includes('italy') || league.includes('italia') ||
                    league.includes('england') || league.includes('ingla') ||
                    league.includes('serie c') || league.includes('premier league 2');

                if (allowedJuvenile) return true;

                // Excluir si el equipo o liga contiene patrones juveniles
                const excludePatterns = ['u19', 'u21', 'u20', 'u18', 'u17', 'u23', 'sub-19', 'sub-21', 'sub-20', 'sub-18', 'sub 19', 'sub 21'];
                for (const pattern of excludePatterns) {
                    if (homeTeam.includes(pattern) || awayTeam.includes(pattern) || league.includes(pattern)) {
                        return false;
                    }
                }
                return true;
            });

            // Filtro: Excluir partidos sin resultado definido (??)
            filteredResults = filteredResults.filter(item => {
                const c = item.candidate;
                const score = c.score || '';
                // Excluir si el score es ??, ?:?, vacío, o no tiene formato válido
                if (!score || score === '??' || score === '?:?' || score.includes('?')) {
                    return false;
                }
                return true;
            });

            // Filtro de cobertura AH (client-side)
            const coverFilter = document.getElementById('filter-cover-result').value;
            if (coverFilter) {
                filteredResults = filteredResults.filter(item => {
                    const c = item.candidate;
                    if (!c.score || c.ah_real === null || c.ah_real === undefined) return false;
                    const parts = c.score.replace('-', ':').split(':');
                    const ah = parseFloat(c.ah_real);
                    if (parts.length !== 2) return false;
                    const golesLocal = parseInt(parts[0]);
                    const golesVisitante = parseInt(parts[1]);

                    // LÓGICA UNIFICADA: AH > 0 significa Local es Favorito
                    const res = calculateH2HResult(c.score, ah);
                    return res === coverFilter;
                });
            }

            // --- Filtros AH MultiSelect ---

            // Handicap
            const handicapValues = msHandicap ? msHandicap.getValues() : [];
            if (handicapValues.length > 0) filteredResults = filteredResults.filter(i => checkAhMatch(i.candidate.ah_real, handicapValues));

            // Prev Home AH
            const prevHomeValues = msPrevHomeAh ? msPrevHomeAh.getValues() : [];
            if (prevHomeValues.length > 0) filteredResults = filteredResults.filter(i => i.prev_home && checkAhMatch(i.prev_home.ah, prevHomeValues));

            // Prev Away AH
            const prevAwayValues = msPrevAwayAh ? msPrevAwayAh.getValues() : [];
            if (prevAwayValues.length > 0) filteredResults = filteredResults.filter(i => i.prev_away && checkAhMatch(i.prev_away.ah, prevAwayValues));

            // H2H Col3 AH
            const col3Values = msH2hCol3Ah ? msH2hCol3Ah.getValues() : [];
            if (col3Values.length > 0) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.h2h_col3 || !isValidValue(i.h2h_col3.handicap)) return false;
                    return checkAhMatch(i.h2h_col3.handicap, col3Values);
                });
            }

            // Ind. Local AH
            const indLocalValues = msIndLocalAh ? msIndLocalAh.getValues() : [];
            if (indLocalValues.length > 0) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.ind_local) return false;
                    const ah = isValidValue(i.ind_local.ah_line) ? i.ind_local.ah_line : i.ind_local.ah;
                    return checkAhMatch(ah, indLocalValues);
                });
            }

            // Ind. Visitante AH
            const indVisitValues = msIndVisitanteAh ? msIndVisitanteAh.getValues() : [];
            if (indVisitValues.length > 0) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.ind_visitante) return false;
                    const ah = isValidValue(i.ind_visitante.ah_line) ? i.ind_visitante.ah_line : i.ind_visitante.ah;
                    return checkAhMatch(ah, indVisitValues);
                });
            }

            // --- Filtros de Resultado (Res) - Usa el AH FINAL del movimiento H2H ---
            const fH2HStadiumRes = document.getElementById('filter-h2h-stadium-res').value;
            if (fH2HStadiumRes) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.h2h_stadium || !i.h2h_stadium.score || i.h2h_stadium.score === '?:?') return false;
                    // Usar el AH final del movimiento H2H
                    const mov = parseH2HMovement(i.h2h_stadium.movement);
                    const ahFinal = mov.end;
                    if (ahFinal === null || isNaN(ahFinal)) return false;
                    const res = calculateH2HResult(i.h2h_stadium.score, ahFinal, false);
                    return res === fH2HStadiumRes;
                });
            }

            const fH2HGeneralRes = document.getElementById('filter-h2h-general-res').value;
            if (fH2HGeneralRes) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.h2h_general || !i.h2h_general.score || i.h2h_general.score === '?:?') return false;

                    // Consistent with renderTable: if it's the same as stadium, it's considered "empty" (-)
                    const stData = i.h2h_stadium;
                    const genData = i.h2h_general;
                    const isSameAsStadium = stData && genData && stData.date === genData.date && stData.score === genData.score;
                    if (isSameAsStadium) return false;

                    // Usar el AH final del movimiento H2H
                    const mov = parseH2HMovement(i.h2h_general.movement);
                    const ahFinal = mov.end;
                    if (ahFinal === null || isNaN(ahFinal)) return false;
                    // Usar isInverted = true para H2H General
                    const res = calculateH2HResult(i.h2h_general.score, ahFinal, true);
                    return res === fH2HGeneralRes;
                });
            }

            // --- Filtro H2H General Mov - Considera inversión de localías ---
            // En H2H General, "Igual" = mismo valor absoluto (ej: 0.5 → -0.5 es "Igual")
            const fH2HGeneralMov = document.getElementById('filter-h2h-general-mov').value;
            if (fH2HGeneralMov) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.h2h_general || !i.h2h_general.movement) return false;
                    // Excluir si es el mismo que stadium
                    const stData = i.h2h_stadium;
                    const genData = i.h2h_general;
                    const isSameAsStadium = stData && genData && stData.date === genData.date && stData.score === genData.score;
                    if (isSameAsStadium) return false;
                    const direction = getH2HGeneralMovementDirection(i.h2h_general.movement);
                    return direction === fH2HGeneralMov;
                });
            }

            // --- Filtros H2H Stadium Movement AH ---
            const fH2HStadiumStartAh = document.getElementById('filter-h2h-stadium-start-ah').value;
            const fH2HStadiumEndAh = document.getElementById('filter-h2h-stadium-end-ah').value;
            if (fH2HStadiumStartAh || fH2HStadiumEndAh) {
                console.log(`Filtering H2H Stadium: Start=${fH2HStadiumStartAh}, End=${fH2HStadiumEndAh}`);
                filteredResults = filteredResults.filter(i => {
                    if (!i.h2h_stadium || !i.h2h_stadium.movement || i.h2h_stadium.movement === 'N/A') return false;
                    const mov = parseH2HMovement(i.h2h_stadium.movement);
                    if (fH2HStadiumStartAh) {
                        const movStartBucket = normalizeToHandicapBucket(mov.start);
                        if (!matchesBucketOrExtreme(movStartBucket, fH2HStadiumStartAh)) return false;
                    }
                    if (fH2HStadiumEndAh) {
                        const movEndBucket = normalizeToHandicapBucket(mov.end);
                        if (!matchesBucketOrExtreme(movEndBucket, fH2HStadiumEndAh)) return false;
                    }
                    return true;
                });
            }

            // --- Filtros H2H General Movement AH ---
            const fH2HGeneralStartAh = document.getElementById('filter-h2h-general-start-ah').value;
            const fH2HGeneralEndAh = document.getElementById('filter-h2h-general-end-ah').value;
            if (fH2HGeneralStartAh || fH2HGeneralEndAh) {
                console.log(`Filtering H2H General: Start=${fH2HGeneralStartAh}, End=${fH2HGeneralEndAh}`);
                filteredResults = filteredResults.filter(i => {
                    if (!i.h2h_general || !i.h2h_general.movement || i.h2h_general.movement === 'N/A') return false;
                    // Excluir si es el mismo que stadium
                    const stData = i.h2h_stadium;
                    const genData = i.h2h_general;
                    const isSameAsStadium = stData && genData && stData.date === genData.date && stData.score === genData.score;
                    if (isSameAsStadium) return false;

                    const mov = parseH2HMovement(i.h2h_general.movement);
                    if (fH2HGeneralStartAh) {
                        const movStartBucket = normalizeToHandicapBucket(mov.start);
                        if (!matchesBucketOrExtreme(movStartBucket, fH2HGeneralStartAh)) return false;
                    }
                    if (fH2HGeneralEndAh) {
                        const movEndBucket = normalizeToHandicapBucket(mov.end);
                        if (!matchesBucketOrExtreme(movEndBucket, fH2HGeneralEndAh)) return false;
                    }
                    return true;
                });
            }

            // Filtro H2H Col3 (Performance)
            const fH2HCol3Cover = document.getElementById('filter-h2h-col3-cover').value;
            const fH2HCol3Mirror = document.getElementById('filter-h2h-col3-mirror').value;

            if (fH2HCol3Cover || fH2HCol3Mirror) {
                // Para simplificar, como Performance se calcula en renderTable, 
                // para filtrar el array tendríamos que replicar el cálculo o usar el resultado previo si lo guardamos.
                // En Explorer, preferimos filtrar por array para paginación.
                // Sin embargo, el cálculo de performanceStatus es complejo.
                // Lo aplicaremos visualmente al final para no duplicar 300 líneas de lógica de comparación.
            }

            // Ind. Local Res
            const fIndLocalRes = document.getElementById('filter-ind-local-res').value;
            if (fIndLocalRes) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.ind_local || !i.ind_local.score) return false;
                    const cov = getIndCoverStatus(i.ind_local.score, i.ind_local.localia, true, parseFloat(i.candidate.ah_real)) || i.ind_local.cover_status;
                    let normCov = cov;
                    if (cov === 'CUBIERTO') normCov = 'COVER';
                    if (cov === 'NO CUBIERTO') normCov = 'NO_COVER';
                    return normCov === fIndLocalRes;
                });
            }

            // Ind. Visitante Res
            const fIndVisitanteRes = document.getElementById('filter-ind-visitante-res').value;
            if (fIndVisitanteRes) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.ind_visitante || !i.ind_visitante.score) return false;
                    const cov = getIndCoverStatus(i.ind_visitante.score, i.ind_visitante.localia, false, parseFloat(i.candidate.ah_real)) || i.ind_visitante.cover_status;
                    let normCov = cov;
                    if (cov === 'CUBIERTO') normCov = 'COVER';
                    if (cov === 'NO CUBIERTO') normCov = 'NO_COVER';
                    return normCov === fIndVisitanteRes;
                });
            }

            // Ind. Local Localía (H/A)
            const fIndLocalLoc = document.getElementById('filter-ind-local-loc').value;
            if (fIndLocalLoc) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.ind_local || !i.ind_local.localia) return false;
                    const loc = i.ind_local.localia;
                    const normLoc = (loc === 'L' || loc === 'H' || loc === 'Local' || loc === 'Home') ? 'H' : 'A';
                    return normLoc === fIndLocalLoc;
                });
            }

            // Ind. Visitante Localía (H/A)
            const fIndVisitanteLoc = document.getElementById('filter-ind-visitante-loc').value;
            if (fIndVisitanteLoc) {
                filteredResults = filteredResults.filter(i => {
                    if (!i.ind_visitante || !i.ind_visitante.localia) return false;
                    const loc = i.ind_visitante.localia;
                    const normLoc = (loc === 'L' || loc === 'H' || loc === 'Local' || loc === 'Home') ? 'H' : 'A';
                    return normLoc === fIndVisitanteLoc;
                });
            }

            // Filtro O/U (client-side)
            const ouFilterValues = getOuFilterValues();
            if (ouFilterValues.length > 0) {
                filteredResults = filteredResults.filter(item => {
                    return checkOuMatch(item.candidate.ou_line, ouFilterValues);
                });
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredResults.slice(start, end);
            renderTable(pageItems);

            // Filtros visuales (Performance H2H Col3)
            if (fH2HCol3Cover || fH2HCol3Mirror) {
                const tbody = document.getElementById('table-body');
                const rows = tbody.querySelectorAll('tr[data-match_id]');
                rows.forEach(row => {
                    let show = true;
                    if (fH2HCol3Cover && row.dataset.h2h_col3_cover !== fH2HCol3Cover) show = false;
                    if (fH2HCol3Mirror && row.dataset.h2h_col3_mirror !== fH2HCol3Mirror) show = false;

                    row.style.display = show ? '' : 'none';

                    // Also hide/show the associated stats row (next sibling without data-match_id)
                    const nextRow = row.nextElementSibling;
                    if (nextRow && !nextRow.hasAttribute('data-match_id')) {
                        nextRow.style.display = show ? '' : 'none';
                    }
                });
            }

            renderPaginationControls(filteredResults.length);

            // Reinitialize Bootstrap collapses after rendering
            reinitBootstrapCollapses();
        }

        function applyClientFilters() {
            currentPage = 1;
            renderTableWithPagination();
        }

        function changePage(page) {
            const totalPages = Math.ceil(totalResults.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTableWithPagination();
        }

        function renderPaginationControls(totalCount) {
            if (totalCount === undefined) totalCount = totalResults.length;
            const paginationBar = document.getElementById('pagination-bar');
            const paginationInfo = document.getElementById('pagination-info');
            const navTop = document.getElementById('pagination-nav-top');
            const listaTop = document.getElementById('pagination-lista-top');
            const totalPages = Math.ceil(totalCount / itemsPerPage);

            // Siempre mostrar la barra si hay resultados
            if (totalCount > 0) {
                if (paginationBar) paginationBar.style.cssText = 'display: flex !important;';
                const start = (currentPage - 1) * itemsPerPage + 1;
                const end = Math.min(currentPage * itemsPerPage, totalCount);
                if (paginationInfo) paginationInfo.textContent = `Mostrando ${start} -${end} de ${totalCount} `;
            } else {
                if (paginationBar) paginationBar.style.cssText = 'display: none !important;';
            }

            if (totalPages <= 1) {
                if (navTop) navTop.classList.add('d-none');
                return;
            }

            if (navTop) navTop.classList.remove('d-none');

            listaTop.innerHTML = '';

            // Previous
            const prevLi = document.createElement('li');
            prevLi.className = `page - item ${currentPage === 1 ? 'disabled' : ''} `;
            prevLi.innerHTML = `<a class="page-link" href = "#" onclick = "changePage(${currentPage - 1}); return false;"> Anterior</a> `;
            listaTop.appendChild(prevLi);

            // Info
            const infoLi = document.createElement('li');
            infoLi.className = 'page-item disabled';
            infoLi.innerHTML = `<span class="page-link"> Pág ${currentPage} /${totalPages}</span> `;
            listaTop.appendChild(infoLi);

            // Next
            const nextLi = document.createElement('li');
            nextLi.className = `page - item ${currentPage === totalPages ? 'disabled' : ''} `;
            nextLi.innerHTML = `<a class="page-link" href = "#" onclick = "changePage(${currentPage + 1}); return false;"> Siguiente</a> `;
            listaTop.appendChild(nextLi);
        }

        function renderTable(results) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (!results || results.length === 0) {
                tbody.innerHTML = `<tr>
                <td colspan="10" class="text-center py-4">No se encontraron resultados</td>
    </tr> `;
                return;
            }

            const formatAh = (val) => val !== null && val !== undefined ? val : '-';

            // Helper igual a Pre-Cacheo
            const isValidValue = (val) => val !== undefined && val !== null && val !== 'undefined' && val !== '';

            results.forEach(item => {
                const c = item.candidate;

                // League & Rank Data
                const league = c.league || '';

                const hRankVal = (item.home_standings && item.home_standings.ranking && item.home_standings.ranking !== 'N/A') ? item.home_standings.ranking : '';
                const homeRank = hRankVal ? `[${hRankVal}]` : '';

                const aRankVal = (item.away_standings && item.away_standings.ranking && item.away_standings.ranking !== 'N/A') ? item.away_standings.ranking : '';
                const awayRank = aRankVal ? `[${aRankVal}]` : '';

                // Stats Helper
                const fmtStats = (s, type) => {
                    if (!s) return null;
                    const p = type === 'total' ? 'total' : 'specific';
                    const v = s[`${p}_v`];
                    const e = s[`${p}_e`];
                    const d = s[`${p}_d`];
                    if (v === '' || v === undefined || v === 'N/A') return null;
                    return `${v} -${e} -${d} `;
                };

                let homeStatsHtml = '';
                if (item.home_standings) {
                    const g = fmtStats(item.home_standings, 'total');
                    const s = fmtStats(item.home_standings, 'specific');
                    if (g || s) {
                        homeStatsHtml = `
            <div class="mt-1 text-muted" style = "font-size: 0.7rem; line-height: 1.1;">
                ${g ? `<div>G: ${g}</div>` : ''}
                                ${s ? `<div>L: ${s}</div>` : ''}
                            </div> `;
                    }
                }

                let awayStatsHtml = '';
                if (item.away_standings) {
                    const g = fmtStats(item.away_standings, 'total');
                    const s = fmtStats(item.away_standings, 'specific');
                    if (g || s) {
                        awayStatsHtml = `
            <div class="mt-1 text-muted" style = "font-size: 0.7rem; line-height: 1.1;">
                ${g ? `<div>G: ${g}</div>` : ''}
                                ${s ? `<div>V: ${s}</div>` : ''}
                            </div> `;
                    }
                }

                const tr = document.createElement('tr');

                // Prev Home Cell Logic
                let prevHomeHtml = '';
                let prevHomeHasData = false;
                if (item.prev_home) {
                    // Check if meaningful data exists
                    if (isValidValue(item.prev_home.score) || isValidValue(item.prev_home.ah)) {
                        prevHomeHasData = true;
                        const currentAh = parseFloat(c.ah_real);
                        let wdlClass = 'text-dark';
                        if (!isNaN(currentAh)) {
                            const localPerspectiveAh = -currentAh;
                            const coverResult = calculateWDL(item.prev_home.score, localPerspectiveAh, true);

                        let rHome = item.prev_home.home_team;
                        let rAway = item.prev_home.away_team;
                        if (!rHome || !rAway) {
                            const parts = (item.prev_home.rival || '').split(' vs ');
                            if (parts.length > 1) {
                                rHome = parts[0];
                                rAway = parts[1];
                            } else {
                                rHome = c.home;
                                rAway = item.prev_home.rival || '';
                            }
                        }

                        prevHomeHtml = `
                        <div class="d-flex flex-column">

                            <div class="small" style="font-size: 0.65rem; line-height: 1.1;">

                            </div>

                }

                // Prev Away Cell Logic
                let prevAwayHtml = '';
                let prevAwayHasData = false;
                if (item.prev_away) {
                    if (isValidValue(item.prev_away.score) || isValidValue(item.prev_away.ah)) {
                        prevAwayHasData = true;
                        const currentAh = parseFloat(c.ah_real);
                        let wdlClass = 'text-dark';
                        if (!isNaN(currentAh)) {
                            const awayPerspectiveAh = currentAh;
                            const coverResult = calculateWDL(item.prev_away.score, awayPerspectiveAh, false);
                            wdlClass = coverResult === 'HOME_WIN' ? 'text-success' : (coverResult === 'AWAY_WIN' ? 'text-danger' : 'text-push');
                        }

                        let rHome = item.prev_away.home_team;
                        let rAway = item.prev_away.away_team;
                        if (!rHome || !rAway) {
                            const parts = (item.prev_away.rival || '').split(' vs ');
                            if (parts.length > 1) {
                                rHome = parts[0];
                                rAway = parts[1];
                            } else {
                                rHome = item.prev_away.rival || '';
                                rAway = c.away;
                            }
                        }

                        prevAwayHtml = `
                        <div class="d-flex flex-column">
                            ${item.prev_away.date ? `<div class="text-muted" style="font-size: 0.55rem;">${item.prev_away.date}</div>` : ''}
                            <div class="d-flex justify-content-between">
                                <span class="fw-bold small">${formatAh(item.prev_away.ah)}</span>
                                <span class="${wdlClass} fw-bold">${item.prev_away.score}</span>

                            <div class="small" style="font-size: 0.65rem; line-height: 1.1;">
                                <span class="text-home">${rHome}</span> <span class="text-muted" style="font-size:0.6rem">vs</span> <span class="text-away">${rAway}</span>
                            </div>
                        </div>`;

                }

                // --- H2H Estadio with calculated WDL colors ---
                // --- FT Result Color Logic ---
                const currentAh = parseFloat(c.ah_real);
                let ftColor = 'text-dark';
                let ftRes = '';
                if (c.score && c.score !== '?:?' && !isNaN(currentAh)) {

                    else if (ftRes === 'NO_COVER') ftColor = 'text-danger';
                    else if (ftRes === 'PUSH') ftColor = 'text-push';
                }

                // Nota: localEsFavorito no se usa directamente para H2H (usa calculateH2HResult)
                // pero lo mantenemos consistente: AH > 0 = Local Favorito
                const localEsFavorito = !isNaN(currentAh) && currentAh > 0;

                let h2hStadiumHtml = '<span class="text-muted">-</span>';
                let h2hStadiumResAttr = '';
                if (item.h2h_stadium && ((item.h2h_stadium.movement && item.h2h_stadium.movement !== 'N/A') || (item.h2h_stadium.score && item.h2h_stadium.score !== '?:?'))) {
                    const st = item.h2h_stadium;
                    let movColor = 'text-dark';
                    if (st.score && st.score !== 'N/A' && st.score !== '?:?' && !isNaN(currentAh)) {
                        const h2hRes = calculateH2HResult(st.score, currentAh);
                        h2hStadiumResAttr = h2hRes;
                        movColor = h2hRes === 'COVER' ? 'text-success' : (h2hRes === 'NO_COVER' ? 'text-danger' : 'text-push');

        <div class="fw-bold small ${movColor}">${st.movement}</div>
                            ${(st.score && st.score !== 'N/A' && st.score !== '?:?') ? `<div class="small ${movColor}" style="font-size: 0.7rem;">${st.score}</div>` : ''}
                        </div>
            `;
